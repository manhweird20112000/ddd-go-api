services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: go-template:dev
    entrypoint: ["/migrate", "up"]
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: go-template:dev
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: otel-collector:4317
      OTLP_INSECURE: "true"
      SERVICE_NAME: go-template
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?set JWT_PRIVATE_KEY_BASE64 in .env}
      JWT_ISSUER: go-template
      JWT_AUDIENCE: go-template-api
    ports:
      - "8080:8080"
      - "9100:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
