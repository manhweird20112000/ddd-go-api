services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro

  db-roles:
    image: postgres:16
    entrypoint: ["sh", "/bootstrap/roles.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - ./deploy/postgres/roles.sh:/bootstrap/roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: go-template:dev
    entrypoint: ["/migrate", "up"]
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
    depends_on:
      db-roles:
        condition: service_completed_successfully

  api:
    image: go-template:dev
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      NOTIFICATION_DATABASE_URL: postgres://notification_app:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: otel-collector:4317
      OTLP_INSECURE: "true"
      SERVICE_NAME: go-template
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?set JWT_PRIVATE_KEY_BASE64 in .env}
      IDEMPOTENCY_KEY_BASE64: ${IDEMPOTENCY_KEY_BASE64:?set IDEMPOTENCY_KEY_BASE64 in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_ISSUER: go-template
      JWT_AUDIENCE: go-template-api
    ports:
      - "8080:8080"
      - "9100:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    profiles: [worker]
    image: go-template:dev
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      NOTIFICATION_DATABASE_URL: postgres://notification_app:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  nats:
    profiles: [distributed]
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-api:
    profiles: [distributed]
    image: go-template:dev
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: otel-collector:4317
      OTLP_INSECURE: "true"
      SERVICE_NAME: identity-api
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?set JWT_PRIVATE_KEY_BASE64 in .env}
      IDEMPOTENCY_KEY_BASE64: ${IDEMPOTENCY_KEY_BASE64:?set IDEMPOTENCY_KEY_BASE64 in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLED_MODULES: identity
      EVENT_BUS: nats
      NATS_URL: nats://nats:4222
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    profiles: [distributed]
    image: go-template:dev
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      NOTIFICATION_DATABASE_URL: postgres://notification_app:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}@postgres:5432/template?sslmode=disable
      ENABLED_MODULES: notification
      EVENT_BUS: nats
      NATS_URL: nats://nats:4222
      IDENTITY_GRPC_ADDR: identity-api:9090
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      identity-api:
        condition: service_started

volumes:
  postgres_data:
