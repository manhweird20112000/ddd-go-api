version: "2"
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/yourorg/go-template
            - github.com
            - go.opentelemetry.io
            - golang.org
            - google.golang.org
